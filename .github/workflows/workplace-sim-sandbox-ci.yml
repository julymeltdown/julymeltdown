name: Workplace Sim Sandbox CI

on:
  push:
    branches: [workplace-sim-sandbox-ci]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workplace-sim-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workplace-sim-sandbox
      - name: Apply staged source bundle
        run: |
          if compgen -G '.staging/bundle.part-*' >/dev/null; then
            cat .staging/bundle.part-* | base64 --decode > /tmp/staged-source.tar.gz
            EXPECTED_SHA="$(cat .staging/bundle.sha256)"
            echo "${EXPECTED_SHA}  /tmp/staged-source.tar.gz" | sha256sum -c -
            tar -xzf /tmp/staged-source.tar.gz -C ..
            rm -rf .staging /tmp/staged-source.tar.gz
          fi
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Persist verified sources and formatting
        run: |
          git add Cargo.toml Cargo.lock crates docs
          git add -A .staging
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -s -m 'feat(sim): add GitHub session provisioning contracts'
            git push origin HEAD:workplace-sim-sandbox-ci
          fi
