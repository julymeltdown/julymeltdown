name: Workplace Sim Sandbox CI

on:
  push:
    branches: [workplace-sim-sandbox-ci]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workplace-sim-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workplace-sim-sandbox
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Persist generated lockfile and formatting
        run: |
          git add Cargo.lock crates
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -s -m "style(sim): apply verified Rust formatting"
            git push origin HEAD:workplace-sim-sandbox-ci
          fi
