[workspace]
members = [
    "crates/buzz-sim-protocol",
    "crates/buzz-sandbox-runner",
    "crates/buzz-sim-github",
    "crates/buzz-sim-agent",
    "crates/buzz-sim-executor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
hex = "0.4"
hmac = "0.13"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

buzz-sim-protocol = { path = "crates/buzz-sim-protocol" }
buzz-sim-github = { path = "crates/buzz-sim-github" }
buzz-sim-agent = { path = "crates/buzz-sim-agent" }
buzz-sim-executor = { path = "crates/buzz-sim-executor" }
